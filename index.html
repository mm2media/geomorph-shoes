<style>
:root{--gold:#c9a45c;--gold2:#e6c98a;--mu:#8a8578}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;color:#eee;font-family:Inter,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}

#hud p{color:#bbb;font-size:14px;font-weight:300}#hud .soles{margin-top:8px;font-size:11px;letter-spacing:.18em;color:var(--mu);text-transform:uppercase}

#intro .w{font-family:"Cormorant Garamond",serif;letter-spacing:.45em;font-size:26px;color:var(--gold2)}#intro .s{font-size:11px;letter-spacing:.3em;color:var(--mu)}
#bar{width:160px;height:1px;background:#222}#bar div{height:100%;width:0;background:var(--gold);transition:width .3s}
.close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:5vw;z-index:2}
@media(max-width:700px){header .tag{display:none}.logo{font-size:17px;letter-spacing:.26em}.logo img{width:26px;height:26px}#nav{display:none}}
#top{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;transition:opacity .9s,transform .9s;touch-action:pan-x}
#top.out{opacity:0;transform:translateY(-6%);pointer-events:none}
#top .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}#top .sl.on{opacity:1}
#top .sl div{position:absolute;inset:-6%;background:center/cover no-repeat;transform:translate(var(--mx,0),var(--my,0)) scale(1.02);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
#top .sl.on div{animation:kb 9s ease-out forwards}@keyframes kb{from{scale:1}to{scale:1.1}}
#top .sh{position:absolute;inset:0;background:linear-gradient(#000a,transparent 30%,transparent 55%,#000e);pointer-events:none}
#top .tx{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;padding:0 6vw}
#top .k{font-size:11px;letter-spacing:.35em;color:var(--gold)}#top h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(34px,6vw,64px);color:var(--gold2);letter-spacing:.06em;margin:8px 0 6px;transition:opacity .6s}
#top .ln{color:#bbb;font-weight:300;font-size:14px;margin-bottom:18px;transition:opacity .6s}
#top .dots{display:flex;gap:10px;justify-content:center;margin-bottom:20px}#top .dots button{width:28px;height:2px;border:0;background:#c9a45c44;cursor:pointer;padding:0;position:relative;overflow:hidden}
#top .dots button.on::after{content:"";position:absolute;inset:0;background:var(--gold);animation:pg 7s linear forwards}@keyframes pg{from{transform:translateX(-100%)}to{transform:none}}
#top .ar{position:absolute;top:50%;transform:translateY(-50%);background:#0008;z-index:2}#top .ar.l{left:2vw}#top .ar.r{right:2vw}
#top .cue{display:block;margin:14px auto 0;font-size:10px;letter-spacing:.3em;color:var(--mu);animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(4px)}}
@media(max-width:700px){#top .ar{display:none}}
</style></head><body>
<section id="top" aria-label="Featured concepts"><div class="sl on"><div></div></div><div class="sl"><div></div></div><div class="sl"><div></div></div><div class="sh"></div>
<button class="btn ar l" id="tp" aria-label="Previous">‹</button><button class="btn ar r" id="tn" aria-label="Next">›</button>
<div class="tx"><div class="k" id="tk"></div><h1 id="th"></h1><p class="ln" id="tl"></p><div class="dots" id="td"></div><button class="btn" id="tgo">Explore the Collection</button><span class="cue">SWIPE UP OR SCROLL</span></div></section>
<script>(()=>{const HV='7e1c587',S=[['serpent','Serpent Runner','Scaled lattice coils into a sculpted sneaker'],['liquid-cage-jelly','Liquid Cage','Organic mesh flowing over a gyroid slip-on'],['mountain','Faceted Peak','Low-poly Chelsea boot carved like stone']];
const T=document.getElementById('top'),sl=T.querySelectorAll('.sl'),d=document.getElementById('td');let i=0,tm;
S.forEach((x,j)=>{sl[j].firstChild.style.backgroundImage=`url(img/hero/${x[0]}.webp?v=${HV})`;const b=document.createElement('button');b.setAttribute('aria-label',x[1]);b.onclick=()=>go(j);d.appendChild(b)});
function go(j){i=(j+S.length)%S.length;sl.forEach((e,k)=>e.classList.toggle('on',k==i));d.querySelectorAll('button').forEach((e,k)=>{e.classList.remove('on');if(k==i){void e.offsetWidth;e.classList.add('on')}});
document.getElementById('tk').textContent=`FEATURED · 0${i+1} / 0${S.length}`;document.getElementById('th').textContent=S[i][1];document.getElementById('tl').textContent=S[i][2];clearTimeout(tm);tm=setTimeout(()=>go(i+1),7000)}
go(0);document.getElementById('tp').onclick=()=>go(i-1);document.getElementById('tn').onclick=()=>go(i+1);
const close=()=>{if(T.classList.contains('out'))return;T.classList.add('out');clearTimeout(tm);setTimeout(()=>T.style.display='none',900)};document.getElementById('tgo').onclick=close;
T.addEventListener('mousemove',e=>{const x=(e.clientX/innerWidth-.5)*-24,y=(e.clientY/innerHeight-.5)*-24;T.style.setProperty('--mx',x+'px');T.style.setProperty('--my',y+'px')});
T.addEventListener('wheel',e=>{if(e.deltaY>20)close()},{passive:true});
let sx,sy;T.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
T.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));else if(dy<-50)close()});
addEventListener('keydown',e=>{if(T.classList.contains('out'))return;e.stopImmediatePropagation();if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1);if(e.key=='Enter'||e.key=='ArrowDown')close()});})();</script>
<div id="intro"><img src="img/logo-g.png" alt="Geomorph"><div class="w">GEOMORPH</div><div class="s">TPU FOOTWEAR CONCEPTS</div><div id="bar"><div></div></div></div>
<header><a href="#" class="logo"><img src="img/logo-g.png" alt="Geomorph">GEOMORPH</a><span class="tag">Geo → Organic · 3D-printed TPU</span></header>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const C={black:'#111',white:'#eee',gum:'#b5834f',gold:'#c9a45c'};
const S=[
['hex-slipon','Hex Slip-On','The concept that started it: a wave-lattice upper rising from a honeycomb sole. Comes in white or black uppers on black, gum, gold or white soles.',['black','gum','gold','white']],
['voronoi','Voronoi','Cell-pattern upper on a faceted gold truss sole.',['gold']],
['gyroid-slide','Gyroid Slide','Lattice footbed with a hex-mesh strap.',['gum']],
['rib-high','Rib High','High-top with organic ribs wrapping a hex lattice.',['white']],
['ripple-mule','Ripple Mule','Backless mule of contour-line ridges flowing over the foot.',['gold']],
['spine-runner','Spine Runner','Vertebra-style ribs wrap from the sole over the instep.',['white']],
['crystal-cage','Crystal Cage','Faceted low-poly toe shell dissolving into an open lattice.',['gum']],
['wave-slide','Wave Slide','A sculpted strap of twisting wave ribs over a honeycomb footbed.',['gum']],
['facet-melt','Facet Melt','Faceted crystal at the toe melts into liquid drips at the heel.',['gold']],
['hex-bloom','Hex Bloom','Tight hex cells at the toe open into petal shapes at the ankle.',['white']],
['fault-line-boot','Fault Line Boot','Chelsea boot whose cracked plates soften into ribs at the collar.',['gum']],
['coral-truss','Coral Truss','Triangle truss sole branching into a coral lattice upper.',['gold']],
['shatter-flow','Shatter Flow','Cracked faceted toe cap loosening into flowing ribbons.',['gold']],
['hive-root','Hive Root','Honeycomb toe stretching into branching root lines.',['gold']],
['strata-wave','Strata Wave','Stacked flat layers at the toe ripple into waves at the heel.',['white']],
['bone-truss','Bone Truss','Straight truss sole turning into a bone-like heel lattice.',['gold']],
['gyroid-high','Gyroid High','Diamond-grid high-top on a gold sole.',['gold']],
['topo-trail','Topo Trail','Trail runner with faceted lugs and contour-ridge upper.',['gum']],
['liquid-cage','Liquid Cage','Square lattice melting into organic white strands at the heel.',['white']],
['scale-shift','Scale Shift','Sharp geometric scales softening into snakeskin.',['gold']]];
const N=S.length,$=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.045);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
const mgr=new THREE.LoadingManager();mgr.onProgress=(u,l,t)=>{const b=$('bar');if(b)b.firstChild.style.width=(l/t*100)+'%'};
let gone=0;mgr.onLoad=()=>{if(gone++)return;$('intro').style.opacity=0;setTimeout(()=>$('intro').remove(),1000)};
setTimeout(()=>mgr.onLoad(),9000);
const tl=new THREE.TextureLoader(mgr),RAD=9,STEP=0.42,group=new THREE.Group();scene.add(group);
const VER='49e3f04';
const panels=S.map((s,i)=>{const tex=tl.load('img/'+s[0]+'.webp?v='+VER,t=>{const a=t.image.width/t.image.height;m.scale.set(a>1?3.2:3.2*a,a>1?3.2/a:3.2,1)});tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:tex,transparent:true}));m.scale.set(3.2,3.2,1);
 const fr=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.04,1.04)),new THREE.LineBasicMaterial({color:0xc9a45c,transparent:true,opacity:.5}));m.add(fr);
 m.userData.i=i;group.add(m);return m});
// gold particles
const pg=new THREE.BufferGeometry(),P=900,pa=new Float32Array(P*3);for(let i=0;i<P*3;i+=3){const r=4+Math.random()*16,a=Math.random()*6.28;pa[i]=Math.cos(a)*r;pa[i+1]=(Math.random()-.5)*12;pa[i+2]=Math.sin(a)*r}
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xc9a45c,size:.05,transparent:true,opacity:.7,depthWrite:false}));scene.add(pts);
let pos=0,target=0;const clamp=v=>Math.max(0,Math.min(N-1,v));
function layout(){panels.forEach((m,i)=>{const a=(i-pos)*STEP;m.position.set(Math.sin(a)*RAD,Math.sin(i*1.3+performance.now()/1500)*.06,-Math.cos(a)*RAD+RAD);m.rotation.y=-a;const dd=Math.abs(i-pos);m.visible=dd<3.6;const f=Math.max(0,1-dd*.45);m.renderOrder=-Math.round(dd*10);m.material.opacity=.25+.75*f;m.children[0].material.opacity=.15+.6*f})}
function hud(i){const s=S[i];$('n').textContent=String(i+1).padStart(2,'0')+' / '+N;$('t').textContent=s[1];$('hud').setAttribute('aria-label',s[1]);$('d').textContent=s[2];$('s').innerHTML='Soles'+s[3].map(c=>`<i style="background:${C[c]}"></i>${c}`).join('')}
let cur=-1;
// input
let down=null,moved=0;const el=R.domElement;
el.addEventListener('pointerdown',e=>{down={x:e.clientX,t:target};moved=0});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;moved=Math.max(moved,Math.abs(dx));target=clamp(down.t-dx/(innerWidth*.28))});
addEventListener('pointerup',e=>{if(!down)return;down=null;target=Math.round(target);if(moved<6)pick(e)});
el.addEventListener('wheel',e=>{e.preventDefault();target=clamp(target+(e.deltaY+e.deltaX)*.004);clearTimeout(el._w);el._w=setTimeout(()=>target=Math.round(target),160)},{passive:false});
addEventListener('keydown',e=>{if(e.key=='ArrowRight')target=clamp(Math.round(target)+1);if(e.key=='ArrowLeft')target=clamp(Math.round(target)-1);if(e.key=='Enter')openD(Math.round(pos));if(e.key=='Escape'){$('detail').classList.remove('on');closeHero()}});
$('prev').onclick=()=>target=clamp(Math.round(target)-1);$('next').onclick=()=>target=clamp(Math.round(target)+1);
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function pick(e){v2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(v2,cam);const h=ray.intersectObjects(panels,false)[0];if(!h)return;const i=h.object.userData.i;if(i==Math.round(pos))openD(i);else target=i}
function openD(i){const s=S[i];$('dimg').src='img/'+s[0]+'.webp?v='+VER;$('dt').textContent=s[1];$('dimg').alt=s[1]+' concept render';$('dd').textContent=s[2];$('ds').innerHTML='Soles'+s[3].map(c=>`<i style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;background:${C[c]}"></i>${c}`).join('');$('detail').classList.add('on')}
$('dclose').onclick=()=>$('detail').classList.remove('on');
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);
 pos+=(target-pos)*.09;const i=Math.round(pos);if(i!=cur){cur=i;hud(i)}
 cam.position.set(0,.2+Math.sin(performance.now()/3000)*.08,innerWidth<700?9.6:5.6);cam.lookAt(0,0,0);pts.rotation.y+=.0006;layout();R.render(scene,cam)}
loop();
</script></body></html>
